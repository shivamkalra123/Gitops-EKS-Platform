apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-web
  labels: { app.kubernetes.io/name: orders-web }
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: orders-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: orders-web } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: orders-web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports: [{ containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts: [{ name: temp, mountPath: /tmp }]
          livenessProbe: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 5 }
          readinessProbe: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 2 }
      volumes: [{ name: temp, emptyDir: {} }]
